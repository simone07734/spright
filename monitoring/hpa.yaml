apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spright-nf-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spright-nf
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Pods
    pods:
      metric:
        name: func_request_count_rate
      target:
        type: AverageValue
        averageValue: "10"   # scale up when average RPS per pod exceeds 10; tune to actual load
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
